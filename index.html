const sandbox = new THREE.Group();
scene.add(sandbox);
const provinceSize = { x: 245, z: 150 };
const terrainSegX = 240, terrainSegZ = 150;
const terrainGeo = new THREE.PlaneGeometry(provinceSize.x, provinceSize.z, terrainSegX, terrainSegZ);
terrainGeo.rotateX(-Math.PI / 2);
const terrainPos = terrainGeo.attributes.position;

const bump = (x, z, cx, cz, sx, sz, h) => h * Math.exp(-(((x - cx) / sx) ** 2 + ((z - cz) / sz) ** 2));
function proceduralTerrainHeight(x, z) {
  const slope = (1 - (x + provinceSize.x / 2) / provinceSize.x) * 34;
  const waves = 4.2 * Math.sin(x * 0.12) + 3.5 * Math.sin(z * 0.18) + 2.4 * Math.sin(x * 0.25 + z * 0.14) + 1.6 * Math.sin(z * 0.32 - x * 0.1);
  const ridges = bump(x, z, -95, -40, 24, 16, 18) + bump(x, z, -78, 28, 20, 14, 15) + bump(x, z, -45, -8, 22, 16, 12) + bump(x, z, -15, 35, 26, 18, 7);
  const valleys = -6.2 * Math.exp(-(((x - 56) / 48) ** 2)) - 3.2 * Math.exp(-(((z + 6) / 50) ** 2));
  return slope + waves + ridges + valleys;
}
for (let i = 0; i < terrainPos.count; i++) terrainPos.setY(i, proceduralTerrainHeight(terrainPos.getX(i), terrainPos.getZ(i)));
terrainGeo.computeVertexNormals();
const terrainMaterial = new THREE.MeshStandardMaterial({ color: 0x576f84, roughness: .96, metalness: .03 });
const terrainMesh = new THREE.Mesh(terrainGeo, terrainMaterial);
sandbox.add(terrainMesh);
const grid = new THREE.GridHelper(270, 27, 0x36506d, 0x223648); grid.position.y = .2; sandbox.add(grid);

const terrainDx = provinceSize.x / terrainSegX;
const terrainDz = provinceSize.z / terrainSegZ;
const terrainRow = terrainSegX + 1;
function terrainYAtIndex(ix, iz) {
  const cx = Math.max(0, Math.min(terrainSegX, ix));
  const cz = Math.max(0, Math.min(terrainSegZ, iz));
  return terrainPos.array[(cz * terrainRow + cx) * 3 + 1];
}
function terrainHeight(x, z) {
  const fx = (x + provinceSize.x / 2) / terrainDx;
  const fz = (z + provinceSize.z / 2) / terrainDz;
  const x0 = Math.floor(Math.max(0, Math.min(terrainSegX, fx)));
  const z0 = Math.floor(Math.max(0, Math.min(terrainSegZ, fz)));
  const x1 = Math.min(terrainSegX, x0 + 1);
  const z1 = Math.min(terrainSegZ, z0 + 1);
  const tx = Math.max(0, Math.min(1, fx - x0));
  const tz = Math.max(0, Math.min(1, fz - z0));
  const y00 = terrainYAtIndex(x0, z0), y10 = terrainYAtIndex(x1, z0);
  const y01 = terrainYAtIndex(x0, z1), y11 = terrainYAtIndex(x1, z1);
  const y0 = y00 * (1 - tx) + y10 * tx;
  const y1 = y01 * (1 - tx) + y11 * tx;
  return y0 * (1 - tz) + y1 * tz;
}

const clearance = 1.35;
const stationLift = 1.9;
let stations = [
  { id: 'SRC_WN', name: '西北源', x: -108, z: 34, type: 'source' }, { id: 'SRC_WS', name: '西南源', x: -108, z: -34, type: 'source' },
  { id: 'SRC_MW', name: '西部中源', x: -94, z: -2, type: 'source' }, { id: 'GATE_A', name: '上游库闸A', x: -54, z: 22, type: 'gate', gate: 'gateA' },
  { id: 'JN_1', name: '北支汇入站', x: -44, z: 8, type: 'junction' }, { id: 'GATE_C', name: '南支闸C', x: -46, z: -28, type: 'gate', gate: 'gateC' },
  { id: 'SPL1', name: '分流站SPL1', x: -8, z: 0, type: 'split', ratio: [0.52, 0.30, 0.18] }, { id: 'MID_1', name: '东中站1', x: 24, z: 14, type: 'normal' },
  { id: 'GATE_B', name: '中游坝闸B', x: 42, z: -4, type: 'gate', gate: 'gateB' }, { id: 'MID_2', name: '东中站2', x: 52, z: 22, type: 'normal' },
  { id: 'CON_1', name: '总汇站', x: 70, z: 4, type: 'junction' }, { id: 'OUT_E', name: '东部出境', x: 106, z: 2, type: 'sink' }
].map(s => ({ ...s, y: terrainHeight(s.x, s.z) + stationLift, boundaryLevel: terrainHeight(s.x, s.z) + stationLift + 6.5 }));

let edges = [
  { id: 'e1', from: 'SRC_WN', to: 'GATE_A', lift: 5 }, { id: 'e2', from: 'SRC_MW', to: 'JN_1', lift: 3 }, { id: 'e3', from: 'GATE_A', to: 'JN_1', lift: 3 },
  { id: 'e4', from: 'SRC_WS', to: 'GATE_C', lift: 4 }, { id: 'e5', from: 'GATE_C', to: 'SPL1', lift: 3 }, { id: 'e6', from: 'JN_1', to: 'SPL1', lift: 2 },
  { id: 'e7', from: 'SPL1', to: 'MID_1', lift: 2 }, { id: 'e8', from: 'SPL1', to: 'GATE_B', lift: 2 }, { id: 'e9', from: 'SPL1', to: 'MID_2', lift: 2 },
  { id: 'e10', from: 'MID_1', to: 'CON_1', lift: 2 }, { id: 'e11', from: 'GATE_B', to: 'CON_1', lift: 2 }, { id: 'e12', from: 'MID_2', to: 'CON_1', lift: 2 },
  { id: 'e13', from: 'CON_1', to: 'OUT_E', lift: 2 }
];

let stationMeshById = new Map(), edgeMeshById = new Map(), gateMeshById = new Map(), alarmMeshById = new Map();
let stationMap = {}, incoming = {}, outgoing = {}, stationState = {}, edgeState = {};
let selectedStationId = null, draggingStationId = null, terrainEditing = false;
const multiSelected = [];
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

function makeFlowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#1f6fb7'; g.fillRect(0,0,256,256);
  for (let i=0;i<500;i++) { g.fillStyle = `rgba(190,235,255,${Math.random()*0.35})`; g.fillRect(Math.random()*256, Math.random()*256, 2+Math.random()*4, 1+Math.random()*3); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(6,1.4); return t;
}
const flowTexture = makeFlowTexture();

function generateSatelliteTexture() {
  const size = 768;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const xMin = -provinceSize.x / 2, xMax = provinceSize.x / 2;
  const zMin = -provinceSize.z / 2, zMax = provinceSize.z / 2;

  let hMin = Infinity, hMax = -Infinity;
  for (let y = 0; y < size; y += 6) {
    for (let x = 0; x < size; x += 6) {
      const wx = xMin + (x / (size - 1)) * (xMax - xMin);
      const wz = zMin + (y / (size - 1)) * (zMax - zMin);
      const h = terrainHeight(wx, wz);
      hMin = Math.min(hMin, h); hMax = Math.max(hMax, h);
    }
  }

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const wx = xMin + (x / (size - 1)) * (xMax - xMin);
      const wz = zMin + (y / (size - 1)) * (zMax - zMin);
      const h = terrainHeight(wx, wz);
      const n = (h - hMin) / Math.max(1e-6, (hMax - hMin));
      const moisture = 0.5 + 0.3 * Math.sin(wx * 0.06) * Math.cos(wz * 0.07);
      const riverBias = Math.exp(-Math.abs(wz + 5) / 20) * 0.22;
      let r, gg, b;
      if (n < 0.27) { r = 26; gg = 76 + n * 120; b = 155 + n * 80; }
      else if (n < 0.62) { r = 34 + n * 56; gg = 100 + n * 110 + moisture * 25; b = 52 + n * 30; }
      else { r = 118 + n * 70; gg = 110 + n * 54; b = 98 + n * 40; }
      r += riverBias * 65; gg += riverBias * 95; b += riverBias * 120;
      g.fillStyle = `rgb(${Math.min(255, r|0)},${Math.min(255, gg|0)},${Math.min(255, b|0)})`;
      g.fillRect(x, y, 1, 1);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.needsUpdate = true;
  return tex;
}

let satelliteTexture = null;
function setSatelliteLayer(enabled) {
  if (enabled) {
    if (!satelliteTexture) satelliteTexture = generateSatelliteTexture();
    terrainMaterial.map = satelliteTexture;
    terrainMaterial.color.setHex(0xffffff);
    terrainMaterial.roughness = 1.0;
    terrainMaterial.metalness = 0.0;
  } else {
    terrainMaterial.map = null;
    terrainMaterial.color.setHex(0x576f84);
    terrainMaterial.roughness = .96;
    terrainMaterial.metalness = .03;

}

const alarmMaterial = alarmSprite();

const ui = {

  rainV: document.getElementById('rainV'), tempV: document.getElementById('tempV'), windV: document.getElementById('windV'),
  gateAV: document.getElementById('gateAV'), gateBV: document.getElementById('gateBV'), gateCV: document.getElementById('gateCV'),
  stationCount: document.getElementById('stationCount'), edgeCount: document.getElementById('edgeCount'), totalIn: document.getElementById('totalIn'), totalOut: document.getElementById('totalOut'), splitRatio: document.getElementById('splitRatio'), vel: document.getElementById('vel'), climate: document.getElementById('climate'), records: document.getElementById('records'), alarmCount: document.getElementById('alarmCount'),
  stationInfo: document.getElementById('stationInfo'), boundaryLevel: document.getElementById('boundaryLevel'), setBoundaryBtn: document.getElementById('setBoundaryBtn'), edgeFrom: document.getElementById('edgeFrom'), edgeTo: document.getElementById('edgeTo'), edgeLift: document.getElementById('edgeLift'), addEdgeBtn: document.getElementById('addEdgeBtn'), connectSelectedBtn: document.getElementById('connectSelectedBtn'),
  newId: document.getElementById('newId'), newName: document.getElementById('newName'), newType: document.getElementById('newType'), newX: document.getElementById('newX'), newZ: document.getElementById('newZ'), addStationBtn: document.getElementById('addStationBtn'), satelliteToggle: document.getElementById('satelliteToggle'), terrainEditToggle: document.getElementById('terrainEditToggle'), terrainAction: document.getElementById('terrainAction'), terrainRadius: document.getElementById('terrainRadius'), terrainStrength: document.getElementById('terrainStrength')
};
['rain', 'temp', 'wind', 'gateA', 'gateB', 'gateC'].forEach(k => ui[k].addEventListener('input', () => ui[k + 'V'].textContent = ui[k].value));

function rebuildGraph() {
  stationMap = Object.fromEntries(stations.map(s => [s.id, s]));
  incoming = Object.fromEntries(stations.map(s => [s.id, []]));
  outgoing = Object.fromEntries(stations.map(s => [s.id, []]));
  for (const e of edges) { if (incoming[e.to]) incoming[e.to].push(e.id); if (outgoing[e.from]) outgoing[e.from].push(e.id); }
  for (const s of stations) if (!stationState[s.id]) stationState[s.id] = { q: 0, level: s.y, history: [] };
  for (const e of edges) if (!edgeState[e.id]) edgeState[e.id] = { q: 0 };
}

function edgeColor(q, levelNorm) {
  const nq = Math.max(0, Math.min(1, q / 340));
  const nl = Math.max(0, Math.min(1, levelNorm));
  const c = new THREE.Color();
  c.setHSL(0.60 - 0.58 * nq, 0.88, 0.30 + nl * 0.38);
  return c;
}

function stationColor(type, levelNorm) {
  const c = new THREE.Color(type === 'gate' ? 0xffbf66 : type === 'split' ? 0x9ff2ff : type === 'junction' ? 0x8cf7be : type === 'sink' ? 0xff7a7a : 0xc2d9ff);
  const overlay = new THREE.Color().setHSL(0.60 - 0.58 * Math.max(0, Math.min(1, levelNorm)), 0.9, 0.45);
  return c.lerp(overlay, 0.45);
}

function clearMeshes() {
  for (const m of edgeMeshById.values()) sandbox.remove(m);
  for (const m of stationMeshById.values()) sandbox.remove(m);
  for (const m of gateMeshById.values()) sandbox.remove(m);
  for (const m of alarmMeshById.values()) sandbox.remove(m);
  edgeMeshById.clear(); stationMeshById.clear(); gateMeshById.clear(); alarmMeshById.clear();
}

function buildTerrainFollowCurve(a, b, lift) {
  const points = [];
  const segments = 8;
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const x = a.x + (b.x - a.x) * t;
    const z = a.z + (b.z - a.z) * t;
    const base = terrainHeight(x, z) + clearance;
    const lerpY = a.y + (b.y - a.y) * t;
    const hump = Math.sin(t * Math.PI) * lift;
    const y = Math.max(base, lerpY + hump + 0.5);
    points.push(new THREE.Vector3(x, y, z));
  }
  return new THREE.CatmullRomCurve3(points);
}

function buildMeshes() {
  clearMeshes();
  const minBase = Math.min(...stations.map(s => s.y));

  for (const e of edges) {
    const a = stationMap[e.from], b = stationMap[e.to]; if (!a || !b) continue;
    const ay = Math.max(a.y, terrainHeight(a.x, a.z) + clearance);
    const by = Math.max(b.y, terrainHeight(b.x, b.z) + clearance);
    const curve = buildTerrainFollowCurve({ ...a, y: ay }, { ...b, y: by }, e.lift);
    const mesh = new THREE.Mesh(
      new THREE.TubeGeometry(curve, 120, 1.25, 14, false),
      new THREE.MeshPhysicalMaterial({ map: flowTexture, color: 0x49b6ff, transparent: true, opacity: .66, roughness: .22, transmission: .32, clearcoat: .5 })
    );
    mesh.userData.flowTex = mesh.material.map;
    sandbox.add(mesh); edgeMeshById.set(e.id, mesh);
  }

  for (const s of stations) {
    const lv = stationState[s.id]?.level ?? s.y;
    const ln = (lv - minBase) / Math.max(1e-6, (maxBase - minBase));
    const node = new THREE.Mesh(
      new THREE.SphereGeometry(1.9, 14, 14),
      new THREE.MeshStandardMaterial({ color: stationColor(s.type, ln), emissive: 0x15314a, emissiveIntensity: .45 })
    );
    node.position.set(s.x, s.y, s.z); node.userData.stationId = s.id;
    sandbox.add(node); stationMeshById.set(s.id, node);

    const alarm = new THREE.Sprite(alarmMaterial);
    alarm.position.set(s.x, s.y + 4.5, s.z);
    alarm.scale.set(2.2, 2.2, 1);
    alarm.visible = false;
    sandbox.add(alarm); alarmMeshById.set(s.id, alarm);

    if (s.type === 'gate') {
      const gateBar = new THREE.Mesh(new THREE.BoxGeometry(1.1, 5.2, 2.8), new THREE.MeshStandardMaterial({ color: 0xcfd7df, metalness: .45, roughness: .42 }));
      gateBar.position.set(s.x + 1.8, s.y, s.z); sandbox.add(gateBar); gateMeshById.set(s.id, gateBar);
    }
  }

  updateSelectionHighlight();
  ui.stationCount.textContent = stations.length;
  ui.edgeCount.textContent = edges.length;
}

function refreshSelectors() {
  const options = stations.map(s => `<option value="${s.id}">${s.id}(${s.name})</option>`).join('');
  ui.edgeFrom.innerHTML = options; ui.edgeTo.innerHTML = options;
}

function updateSelectionHighlight() {
  for (const [sid, m] of stationMeshById.entries()) {
    if (sid === selectedStationId) m.scale.setScalar(1.38);
    else if (multiSelected.includes(sid)) m.scale.setScalar(1.22);
    else m.scale.setScalar(1);
  }
}

function showStationInfo(id, syncInput = true) {
  selectedStationId = id;
  updateSelectionHighlight();
  const s = stationMap[id];
  const ins = incoming[id]?.join(', ') || '无';
  const outs = outgoing[id]?.join(', ') || '无';
  const rec = stationState[id]?.history.at(-1);
  ui.stationInfo.textContent = `${s.id} ${s.name}\n类型:${s.type}\n坐标:(${s.x.toFixed(1)}, ${s.y.toFixed(1)}, ${s.z.toFixed(1)})\n输入河段:${ins}\n输出河段:${outs}\n当前入流:${(rec?.inQ ?? 0).toFixed(1)}  当前出流:${(rec?.out ?? 0).toFixed(1)}\n水位:${(rec?.level ?? s.y).toFixed(2)} 警戒:${s.boundaryLevel.toFixed(2)}`;
  ui.edgeFrom.value = id;
  if (syncInput && document.activeElement !== ui.boundaryLevel) ui.boundaryLevel.value = s.boundaryLevel.toFixed(2);
}

rebuildGraph(); buildMeshes(); refreshSelectors(); showStationInfo(stations[0].id);
setSatelliteLayer(false);

ui.setBoundaryBtn.addEventListener('click', () => {
  if (!selectedStationId) return;
  const s = stationMap[selectedStationId];
  s.boundaryLevel = Number(ui.boundaryLevel.value) || s.boundaryLevel;
  showStationInfo(selectedStationId);
});

ui.addStationBtn.addEventListener('click', () => {
  const id = ui.newId.value.trim(); if (!id || stationMap[id]) return;
  const x = Number(ui.newX.value), z = Number(ui.newZ.value);
  const y = terrainHeight(x, z) + stationLift;
  const type = ui.newType.value;
  const station = { id, name: ui.newName.value.trim() || id, x, z, y, type, boundaryLevel: y + 6.5 };
  if (type === 'split') station.ratio = [0.5, 0.3, 0.2];
  if (type === 'gate') station.gate = 'gateB';
  stations.push(station);
  rebuildGraph(); buildMeshes(); refreshSelectors(); showStationInfo(id);
});

ui.addEdgeBtn.addEventListener('click', () => {
  const from = ui.edgeFrom.value, to = ui.edgeTo.value; if (!from || !to || from === to) return;
  const id = `e${edges.length + 1}`;
  edges.push({ id, from, to, lift: Number(ui.edgeLift.value) || 2 });
  edgeState[id] = { q: 0 };
  rebuildGraph(); buildMeshes(); showStationInfo(selectedStationId || from);
});

ui.connectSelectedBtn.addEventListener('click', () => {
  if (multiSelected.length < 2) return;
  for (let i = 0; i < multiSelected.length - 1; i++) {
    const from = multiSelected[i], to = multiSelected[i + 1];
    if (from === to) continue;
    const id = `e${edges.length + 1}`;
    edges.push({ id, from, to, lift: Number(ui.edgeLift.value) || 2.5 });
    edgeState[id] = { q: 0 };
  }
  rebuildGraph(); buildMeshes();
  showStationInfo(multiSelected[multiSelected.length - 1]);
});


function refreshTerrainAfterEdit() {
  terrainGeo.computeVertexNormals();
  terrainGeo.attributes.position.needsUpdate = true;
  terrainGeo.attributes.normal.needsUpdate = true;
  for (const s of stations) {
    s.y = terrainHeight(s.x, s.z) + stationLift;
    if (stationState[s.id]) stationState[s.id].level = Math.max(stationState[s.id].level, s.y);
  }
  if (satelliteTexture) {
    satelliteTexture.dispose();
    satelliteTexture = null;
    if (ui.satelliteToggle.checked) setSatelliteLayer(true);
  }
  buildMeshes();
}

function editTerrainAt(x, z) {
  const radius = Number(ui.terrainRadius.value);
  const strength = Number(ui.terrainStrength.value);
  const sign = ui.terrainAction.value === 'raise' ? 1 : -1;
  const arr = terrainPos.array;
  for (let i = 0; i < terrainPos.count; i++) {
    const ix = arr[i * 3], iz = arr[i * 3 + 2];
    const dx = ix - x, dz = iz - z;
    const d = Math.hypot(dx, dz);
    if (d > radius) continue;
    const falloff = Math.exp(-(d * d) / (radius * radius * 0.45));
    arr[i * 3 + 1] += sign * strength * 0.18 * falloff;
  }
  refreshTerrainAfterEdit();
}

function pointerToNDC(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
  mouse.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
}

renderer.domElement.addEventListener('pointerdown', ev => {
  pointerToNDC(ev);
  raycaster.setFromCamera(mouse, camera);

  if (ui.terrainEditToggle.checked) {
    const groundHit = raycaster.intersectObject(terrainMesh)[0];
    if (groundHit) {
      terrainEditing = true;
      controls.enabled = false;
      editTerrainAt(groundHit.point.x, groundHit.point.z);
      return;
    }
  }

  const hit = raycaster.intersectObjects([...stationMeshById.values()])[0];
  if (!hit?.object?.userData?.stationId) return;
  const sid = hit.object.userData.stationId;

  if (ev.shiftKey) {
    if (multiSelected.includes(sid)) multiSelected.splice(multiSelected.indexOf(sid), 1);
    else multiSelected.push(sid);
    selectedStationId = sid;
    showStationInfo(sid);
    return;
  }

  draggingStationId = sid;
  controls.enabled = false;
  if (!multiSelected.includes(sid)) multiSelected.length = 0;
  showStationInfo(draggingStationId);
});

renderer.domElement.addEventListener('pointermove', ev => {
  pointerToNDC(ev);
  raycaster.setFromCamera(mouse, camera);

  if (terrainEditing && ui.terrainEditToggle.checked) {
    const groundHit = raycaster.intersectObject(terrainMesh)[0];
    if (groundHit) editTerrainAt(groundHit.point.x, groundHit.point.z);
    return;
  }

  if (!draggingStationId) return;
  const p = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(dragPlane, p)) {
    const s = stationMap[draggingStationId];
    s.x = Math.max(-provinceSize.x / 2 + 2, Math.min(provinceSize.x / 2 - 2, p.x));
    s.z = Math.max(-provinceSize.z / 2 + 2, Math.min(provinceSize.z / 2 - 2, p.z));
    s.y = terrainHeight(s.x, s.z) + stationLift;
    if (stationState[s.id]) stationState[s.id].level = s.y;
    buildMeshes();
    showStationInfo(s.id);
  }
});

function endDrag() { draggingStationId = null; terrainEditing = false; controls.enabled = true; }
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointerleave', endDrag);

let t = 0;
const clock = new THREE.Clock();
function climateLabel(r, temp) {
  if (r > 95) return '暴雨洪峰过程';
  if (r > 55) return temp > 30 ? '暖湿强对流' : '持续强降雨';
  if (temp < 0) return '低温融雪偏弱';
  if (temp > 35) return '高温蒸发增强';
  return '平稳过渡天气';
}

function simulate(dt) {
  t += dt;
  const rain = +ui.rain.value, temp = +ui.temp.value, wind = +ui.wind.value;
  const gates = { gateA: +ui.gateA.value / 100, gateB: +ui.gateB.value / 100, gateC: +ui.gateC.value / 100 };
  const westRain = rain * (1.2 + 0.12 * Math.sin(t * .14)), eastRain = rain * (0.68 + 0.09 * Math.sin(t * .09 + .8));
  const topoOrder = stations.slice().sort((a, b) => b.y - a.y).map(s => s.id);
  const stationOutMap = {}; let totalIn = 0, totalOut = 0;

  for (const sid of topoOrder) {
    const s = stationMap[sid], ss = stationState[sid];
    const inQ = (incoming[sid] || []).reduce((sum, eid) => sum + (edgeState[eid]?.q || 0), 0);
    const elev = Math.max(.45, Math.min(1.5, s.y / 42));
    const localRain = (s.x < -20 ? westRain : eastRain) * (0.82 + 0.36 * elev);
    const runoff = localRain / 1000 / 3600 * (180000 + 9000 * elev) * (0.24 + localRain / 380);
    const melt = Math.max(0, temp - 7) * (s.y > 20 ? 1.1 : 0.45);
    const avail = inQ + runoff + melt;
    const outEdges = outgoing[sid] || []; let out = 0;

    if (s.type === 'source') out = avail;
    else if (s.type === 'gate') {
      const open = gates[s.gate] ?? .5;
      const cap = 20 + open * (240 + s.y * 2.4);
      ss.level += (avail - Math.min(avail, cap)) * dt * .004;
      ss.level = Math.max(s.y - 2.2, Math.min(s.y + 9.2, ss.level));
      out = Math.min(avail + Math.max(0, ss.level - s.y) * 4.2, cap + 30);
      const gateMesh = gateMeshById.get(s.id); if (gateMesh) gateMesh.position.y = s.y - 1.8 + open * 5.2;
    } else if (s.type === 'split') out = avail * (0.92 - wind * 0.003);
    else if (s.type === 'sink') out = 0;
    else out = avail * 0.95;

    ss.level += (avail - out) * dt * 0.0015;
    ss.level = Math.max(s.y - 3.0, Math.min(s.y + 10.0, ss.level));

    if (outEdges.length === 0) stationOutMap[sid] = {};
    else if (s.type === 'split' && outEdges.length >= 3) {
      const r = s.ratio || [0.5, 0.3, 0.2];
      stationOutMap[sid] = { [outEdges[0]]: out * r[0], [outEdges[1]]: out * r[1], [outEdges[2]]: out * r[2] };
    } else if (outEdges.length > 1) {
      const each = out / outEdges.length;
      stationOutMap[sid] = Object.fromEntries(outEdges.map(eid => [eid, each]));
    } else stationOutMap[sid] = { [outEdges[0]]: out };

    totalIn += inQ; totalOut += out; ss.q += (avail - ss.q) * Math.min(1, dt * .65);
    ss.history.push({ t, inQ, out, level: ss.level }); if (ss.history.length > 120) ss.history.shift();
  }

  const minLvl = Math.min(...stations.map(s => stationState[s.id]?.level ?? s.y));
  const maxLvl = Math.max(...stations.map(s => stationState[s.id]?.level ?? s.y));
  const span = Math.max(1e-6, maxLvl - minLvl);

  for (const [eid, m] of edgeMeshById.entries()) {
    const e = edges.find(x => x.id === eid); if (!e) continue;
    const target = stationOutMap[e.from]?.[e.id] ?? 0;
    edgeState[e.id].q += (target - edgeState[e.id].q) * Math.min(1, dt * .62);
    const lv = ((stationState[e.from]?.level ?? stationMap[e.from].y) + (stationState[e.to]?.level ?? stationMap[e.to].y)) / 2;
    const ln = (lv - minLvl) / span;
    m.material.color.copy(edgeColor(edgeState[e.id].q, ln));
    m.material.opacity = .40 + Math.min(.52, edgeState[e.id].q / 620);
    m.scale.y = .72 + Math.min(1.2, edgeState[e.id].q / 520) * .58;
    m.userData.flowTex.offset.x -= dt * 0.06 * Math.max(0.3, edgeState[e.id].q / 240);
  }

  let alarmCount = 0;
  for (const s of stations) {
    const lv = stationState[s.id]?.level ?? s.y;
    const ln = (lv - minLvl) / span;
    const mesh = stationMeshById.get(s.id); if (mesh) mesh.material.color.copy(stationColor(s.type, ln));
    const alarm = alarmMeshById.get(s.id);
    const over = lv > s.boundaryLevel;
    if (alarm) {
      alarm.position.set(s.x, s.y + 4.5 + Math.sin(t * 1.8) * 0.25, s.z);
      alarm.visible = over;
    }
    if (over) alarmCount++;
  }

  const qPre = edgeState.e8?.q || 0, qPost = edgeState.e11?.q || 0;
  ui.totalIn.textContent = totalIn.toFixed(1); ui.totalOut.textContent = totalOut.toFixed(1);
  ui.splitRatio.textContent = `${(edgeState.e7?.q || 0).toFixed(1)} / ${(edgeState.e8?.q || 0).toFixed(1)} / ${(edgeState.e9?.q || 0).toFixed(1)}`;
  ui.vel.textContent = `${(qPre / (28 + +ui.gateB.value * .2)).toFixed(2)} / ${(qPost / (16 + +ui.gateB.value * .12)).toFixed(2)}`;
  ui.alarmCount.textContent = String(alarmCount);
  ui.climate.textContent = climateLabel(rain, temp);

  const focus = ['GATE_A', 'SPL1', 'GATE_B', 'CON_1', 'OUT_E'].filter(id => stationState[id]);
  ui.records.textContent = focus.map(id => {
    const rec = stationState[id].history.at(-1);
    const s = stationMap[id];
    const mark = (rec?.level ?? s.y) > s.boundaryLevel ? ' !' : '  ';
    return `${id.padEnd(7)} in:${(rec?.inQ ?? 0).toFixed(1).padStart(6)} out:${(rec?.out ?? 0).toFixed(1).padStart(6)} level:${(rec?.level ?? s.y).toFixed(2).padStart(6)}${mark}`;
  }).join('\n');

  if (selectedStationId && stationMap[selectedStationId]) showStationInfo(selectedStationId, false);
  const skyMix = Math.max(0, Math.min(1, rain * .008 + temp * .02));
  scene.background = new THREE.Color().setHSL(.58 - skyMix * .13, .45, .1 + skyMix * .08);
  sun.intensity = 1.38 - Math.min(.92, rain / 150);
  sunMesh.position.x = 125 + Math.sin(t * 0.035) * 22;
  sunMesh.position.y = 112 + Math.cos(t * 0.03) * 6;
  cloudGroup.children.forEach((c, idx) => {
    c.position.x += c.userData.spd * dt * 0.6;
    c.position.z += Math.sin(t * 0.12 + idx) * 0.02;
    if (c.position.x > provinceSize.x / 2 + 30) c.position.x = -provinceSize.x / 2 - 30;
  });
}

function animate() {
  const dt = Math.min(.05, clock.getDelta()) * 8.2;
  simulate(dt);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
