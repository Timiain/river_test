<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>省域多河流动力学沙盘</title>
  <style>
    :root { color-scheme: dark; --panel: rgba(8,16,28,.8); --line: rgba(120,170,220,.35); }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; font-family: "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background: #08121d; color: #d8ecff; }
    #app { position: fixed; inset: 0; }
    .hud { position: absolute; left: 14px; top: 14px; width: min(390px,94vw); background: var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; z-index:5; backdrop-filter: blur(8px); }
    .hud h1 { margin:0 0 8px; font-size:17px; }
    .sub { font-size: 12px; opacity:.85; margin-bottom: 8px; }
    .grid { display:grid; grid-template-columns: 1fr auto; gap:6px 10px; align-items:center; font-size:12px; }
    .grid input[type="range"] { grid-column:1 / -1; width:100%; margin:0 0 6px; accent-color:#5eb7ff; }
    .stats { margin-top:8px; padding-top:8px; border-top:1px solid var(--line); font-size:12px; line-height:1.45; }
    .tip { position:absolute; right:12px; bottom:12px; font-size:12px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:rgba(8,16,28,.65); z-index:5; }
  </style>
</head>
<body>
<div id="app"></div>
<section class="hud">
  <h1>省级多河流动力学沙盘</h1>
  <div class="sub">地形：西高东低 · 三条干支河网 · 坝前/坝后流量联动</div>
  <div class="grid">
    <label for="rain">区域降雨 (mm/h)</label><span id="rainV">36</span>
    <input id="rain" type="range" min="0" max="120" step="1" value="36" />
    <label for="temp">气温 (°C)</label><span id="tempV">24</span>
    <input id="temp" type="range" min="-10" max="42" step="1" value="24" />
    <label for="wind">风速 (m/s)</label><span id="windV">5</span>
    <input id="wind" type="range" min="0" max="20" step="1" value="5" />
    <label for="gate">水坝闸门 (%)</label><span id="gateV">52</span>
    <input id="gate" type="range" min="0" max="100" step="1" value="52" />
  </div>
  <div class="stats">
    <div>主河A/B/C流量: <strong id="rivers">0 / 0 / 0</strong> m³/s</div>
    <div>全省总径流: <strong id="total">0</strong> m³/s</div>
    <div>库区水位: <strong id="level">0</strong> m</div>
    <div>坝前/坝后流速: <strong id="vel">0 / 0</strong> m/s</div>
    <div>蒸发损失: <strong id="evap">0</strong> m³/s</div>
    <div>气候状态: <strong id="climate">--</strong></div>
  </div>
</section>
<div class="tip">拖拽旋转，观察“西高东低”地形与多河流演化</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const root = document.getElementById('app');
if (!window.WebGLRenderingContext) throw new Error('WebGL not supported');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1727);
scene.fog = new THREE.Fog(0x0a1727, 90, 290);

const camera = new THREE.PerspectiveCamera(56, innerWidth / innerHeight, 0.1, 800);
camera.position.set(70, 65, 105);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
root.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 8, 0);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0x97bdff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 1.25); sun.position.set(80, 90, 20); scene.add(sun);

const sandbox = new THREE.Group(); scene.add(sandbox);

const provinceSize = { x: 210, z: 120 }; // 沙盘比例化省域
const terrainGeo = new THREE.PlaneGeometry(provinceSize.x, provinceSize.z, 170, 100);
terrainGeo.rotateX(-Math.PI / 2);

function ridge(x, z, x0, z0, sx, sz, amp) {
  const dx = (x - x0) / sx, dz = (z - z0) / sz;
  return amp * Math.exp(-(dx * dx + dz * dz));
}

const p = terrainGeo.attributes.position;
for (let i = 0; i < p.count; i++) {
  const x = p.getX(i), z = p.getZ(i);
  const westEastSlope = (1 - (x + provinceSize.x / 2) / provinceSize.x) * 28; // 西高东低
  const northSouthUndulate = 2.2 * Math.sin(z * 0.11) + 1.4 * Math.sin(x * 0.08 + z * 0.05);
  const westernMountains = ridge(x, z, -70, -20, 35, 25, 12) + ridge(x, z, -55, 25, 30, 20, 10);
  const easternPlain = -2.5 * Math.exp(-Math.pow((x - 45) / 50, 2));
  p.setY(i, westEastSlope + northSouthUndulate + westernMountains + easternPlain);
}
terrainGeo.computeVertexNormals();

const terrainMat = new THREE.MeshStandardMaterial({ color: 0x4e6375, roughness: 0.95, metalness: 0.05 });
const terrain = new THREE.Mesh(terrainGeo, terrainMat);
sandbox.add(terrain);

const grid = new THREE.GridHelper(230, 23, 0x34506d, 0x233648);
grid.position.y = 0.15;
sandbox.add(grid);

const frame = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(provinceSize.x, 1, provinceSize.z)),
  new THREE.LineBasicMaterial({ color: 0x6f88a6, transparent: true, opacity: 0.5 })
);
frame.position.y = 0.6;
sandbox.add(frame);

function riverPath(points) { return new THREE.CatmullRomCurve3(points.map(v => new THREE.Vector3(...v))); }
const curves = {
  A: riverPath([[-98, 35, -18], [-66, 28, -10], [-28, 20, -8], [9, 14, -5], [34, 11, -3], [65, 8, -2], [96, 6, -1]]),
  B: riverPath([[-92, 33, 22], [-61, 27, 19], [-35, 22, 14], [-7, 17, 8], [26, 12, 4], [58, 9, 2], [94, 6, 1]]),
  C: riverPath([[-88, 30, -38], [-59, 24, -31], [-29, 19, -26], [5, 14, -20], [33, 11, -14], [62, 8, -7], [92, 5, -3]])
};

const riverMeshes = {};
const riverStates = {
  A: { q: 280, lag: Array.from({length: 90}, () => 0), idx: 0, area: 88 },
  B: { q: 180, lag: Array.from({length: 90}, () => 0), idx: 0, area: 65 },
  C: { q: 130, lag: Array.from({length: 90}, () => 0), idx: 0, area: 52 }
};

for (const [k, c] of Object.entries(curves)) {
  const radius = k === 'A' ? 2.2 : k === 'B' ? 1.8 : 1.6;
  const geo = new THREE.TubeGeometry(c, 280, radius, 18, false);
  const mat = new THREE.MeshPhysicalMaterial({ color: 0x43aeff, transparent: true, opacity: 0.68, roughness: 0.22, transmission: 0.35, clearcoat: 0.55 });
  const m = new THREE.Mesh(geo, mat);
  sandbox.add(m);
  riverMeshes[k] = m;
}

const dam = new THREE.Group();
const damWall = new THREE.Mesh(new THREE.BoxGeometry(2.2, 9, 14), new THREE.MeshStandardMaterial({ color: 0x8f97a3, roughness: 0.7 }));
damWall.position.set(40, 15, -3);
const gate = new THREE.Mesh(new THREE.BoxGeometry(0.8, 4.6, 6.8), new THREE.MeshStandardMaterial({ color: 0xcfd7df, metalness: 0.5, roughness: 0.4 }));
gate.position.set(39.1, 13, -3);
const spill = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.7, 8), new THREE.MeshBasicMaterial({ color: 0x40b8ff, transparent: true, opacity: 0.5 }));
spill.position.set(42.1, 10.5, -3);
dam.add(damWall, gate, spill); sandbox.add(dam);

function sectionPlane(x, y, z, w, h) {
  const mat = new THREE.MeshBasicMaterial({ color: 0x57eba8, transparent: true, opacity: 0.55, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  mesh.position.set(x, y, z); mesh.rotation.y = Math.PI / 2; sandbox.add(mesh); return mesh;
}
const preDam = sectionPlane(35.8, 13, -3, 9.2, 5.5);
const postDam = sectionPlane(45.2, 10.8, -3, 9.2, 4.4);

const gaugeLevel = new THREE.Mesh(new THREE.BoxGeometry(1.8,1.8,1.8), new THREE.MeshStandardMaterial({ color: 0x9fefff, emissive: 0x12465c, emissiveIntensity: .5 }));
const gaugeFlow = new THREE.Mesh(new THREE.BoxGeometry(1.8,1.8,1.8), new THREE.MeshStandardMaterial({ color: 0xffa163, emissive: 0x5e2d11, emissiveIntensity: .45 }));
gaugeLevel.position.set(31, 9, -12); gaugeFlow.position.set(47, 9, -12); sandbox.add(gaugeLevel, gaugeFlow);

const ui = {
  rain: document.getElementById('rain'), temp: document.getElementById('temp'), wind: document.getElementById('wind'), gate: document.getElementById('gate'),
  rainV: document.getElementById('rainV'), tempV: document.getElementById('tempV'), windV: document.getElementById('windV'), gateV: document.getElementById('gateV'),
  rivers: document.getElementById('rivers'), total: document.getElementById('total'), level: document.getElementById('level'), vel: document.getElementById('vel'), evap: document.getElementById('evap'), climate: document.getElementById('climate')
};
['rain','temp','wind','gate'].forEach(k => ui[k].addEventListener('input', ()=> ui[k+'V'].textContent = ui[k].value));

const state = { reservoir: 12.6, outflow: 210, evap: 16, vPre: 1.2, vPost: 1.9 };
const clock = new THREE.Clock();
let t = 0;

const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function cLabel(r, temp) {
  if (r > 80) return '季风暴雨';
  if (r > 45) return temp > 30 ? '暖湿强对流' : '持续降雨';
  if (temp < 0) return '低温少雨';
  if (temp > 34) return '高温蒸发增强';
  return '过渡性天气';
}
function velColor(v) {
  const n = clamp((v - 0.3) / 3.8, 0, 1);
  const c = new THREE.Color(); c.setHSL(0.40 - 0.40 * n, 0.85, 0.5); return c;
}

function updateRiver(name, rainWest, rainEast, temp, dt) {
  const rs = riverStates[name];
  const orographic = name === 'A' ? 1.22 : name === 'B' ? 1.0 : 0.88;
  const effectiveRain = (rainWest * 0.62 + rainEast * 0.38) * orographic;
  const runoff = effectiveRain / 1000 / 3600 * (1.4e6 + rs.area * 3000) * clamp(0.24 + effectiveRain / 260, 0.2, 0.75);
  rs.lag[rs.idx] = runoff;
  const qLag = rs.lag[(rs.idx + 90 - 14) % 90] * 0.5 + rs.lag[(rs.idx + 90 - 36) % 90] * 0.33 + rs.lag[(rs.idx + 90 - 60) % 90] * 0.17;
  rs.idx = (rs.idx + 1) % 90;
  const snowmelt = Math.max(0, temp - 6) * (name === 'A' ? 2.3 : 1.6);
  rs.q += (qLag + snowmelt - rs.q) * Math.min(1, dt * (name === 'A' ? 0.42 : 0.36));
}

function tick(dt) {
  t += dt;
  const rain = Number(ui.rain.value), temp = Number(ui.temp.value), wind = Number(ui.wind.value), gateOpen = Number(ui.gate.value)/100;
  const westBoost = rain * (1.15 + 0.08 * Math.sin(t * 0.14));
  const eastRain = rain * (0.72 + 0.06 * Math.sin(t * 0.08 + .9));

  updateRiver('A', westBoost, eastRain, temp, dt);
  updateRiver('B', westBoost * 0.92, eastRain, temp, dt);
  updateRiver('C', westBoost * 0.82, eastRain * 1.06, temp, dt);

  const qa = riverStates.A.q, qb = riverStates.B.q, qc = riverStates.C.q;
  const totalIn = qa + qb + qc;
  state.evap += (clamp((temp - 2) * 0.7 + wind * 0.9, 1, 56) - state.evap) * Math.min(1, dt * 0.35);

  const targetOut = 64 + gateOpen * 340 + Math.max(0, state.reservoir - 8) * 8.5;
  state.outflow += (targetOut - state.outflow) * Math.min(1, dt * 0.58);
  state.reservoir = clamp(state.reservoir + (qa * 0.78 + qb * 0.2 - state.outflow - state.evap) * dt / 1400, 6.2, 24);

  const areaPre = 80 + state.reservoir * 4.5;
  const areaPost = 28 + gateOpen * 18;
  state.vPre += ((qa * 0.78 + qb * 0.2) / areaPre - state.vPre) * Math.min(1, dt * 0.5);
  state.vPost += (state.outflow / areaPost - state.vPost) * Math.min(1, dt * 0.66);

  preDam.material.color.copy(velColor(state.vPre));
  postDam.material.color.copy(velColor(state.vPost));
  preDam.material.opacity = 0.35 + clamp(state.vPre / 4.5, 0, .45);
  postDam.material.opacity = 0.35 + clamp(state.vPost / 4.5, 0, .45);

  const levelN = (state.reservoir - 6.2) / (24 - 6.2);
  gate.position.y = 11.5 + gateOpen * 3.3;
  spill.scale.y = 0.4 + gateOpen * 2.4;
  spill.position.y = 9.5 + levelN * 3.2;
  gaugeLevel.scale.y = 0.6 + levelN * 4.2; gaugeLevel.position.y = 8.2 + gaugeLevel.scale.y;
  gaugeFlow.scale.y = 0.6 + clamp(state.outflow / 420, 0, 1.2) * 4; gaugeFlow.position.y = 8.2 + gaugeFlow.scale.y;

  const flowSpeed = clamp((state.vPre + state.vPost) / 2.2, 0.25, 2.8);
  Object.entries(riverMeshes).forEach(([k,m]) => {
    const q = riverStates[k].q;
    m.material.opacity = 0.48 + clamp(q / 480, 0, .35);
    m.scale.y = 0.72 + clamp(q / 430, 0.2, 1.6) * 0.5;
    m.material.color.setHSL(0.57 - clamp(q / 560, 0, .2), 0.8, 0.58);
    m.rotation.y = Math.sin(t * 0.01 + q * 0.0008) * 0.002 * flowSpeed;
  });

  ui.rivers.textContent = `${qa.toFixed(1)} / ${qb.toFixed(1)} / ${qc.toFixed(1)}`;
  ui.total.textContent = totalIn.toFixed(1);
  ui.level.textContent = state.reservoir.toFixed(2);
  ui.vel.textContent = `${state.vPre.toFixed(2)} / ${state.vPost.toFixed(2)}`;
  ui.evap.textContent = state.evap.toFixed(1);
  ui.climate.textContent = cLabel(rain, temp);

  const skyMix = clamp((rain * 0.012 + temp * 0.018), 0, 1);
  scene.background = new THREE.Color().setHSL(0.58 - skyMix * 0.12, 0.44, 0.11 + skyMix * 0.09);
  sun.intensity = 1.4 - clamp(rain / 120, 0, .9);
}

function animate() {
  const dt = Math.min(0.05, clock.getDelta()) * 8.4;
  tick(dt);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
